name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on a normal runner with no Android toolchain: it proves the parts that can
  # be proven without a device (parser, resolver rules, report, data hygiene).
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests (plain g++)
        run: ./scripts/run_host_tests.sh

      - name: Build-data hygiene
        run: ./scripts/check_no_build_literals.sh

      - name: SDK API type-check
        run: ./scripts/check_sdk_api.sh

  # Same tests through the real build system, proving xmake.lua is valid and that
  # the host targets build under it. Without this, a broken build file is only
  # discovered on the Android runner.
  xmake-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.1.2

      - name: Configure for host
        run: xmake f -p linux -a x86_64 -m release -y

      - name: Build and run host tests
        run: xmake build -y camface_tests && xmake run -y camface_tests

  # The real artifact. Recipe copied from the reference (BedrockTools
  # .github/workflows/build.yml): xmake + nttld/setup-ndk@v1 for NDK r28c.
  #
  # This is the only place an Android build can happen: the NDK is installed by the
  # action on the runner, so nothing needs to be fetched from a local environment.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.1.2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          set -o pipefail
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }} 2>&1 | tee configure.log
          xmake -y 2>&1 | tee build.log
          # A failing first compile hides the command line, so ask xmake for the
          # resolved packages and compile flags directly.
          { echo "=== REQUIREINFO ==="; xmake require --info '*' 2>&1 | head -40;
            echo "=== TARGETINFO ==="; xmake show -t CameraFacing 2>&1 | head -40; } | tee -a build.log || true

      # The job log lives in blob storage and the step summary is not exposed by the
      # API, but check-run *annotations* are. Emitting the failure as a warning
      # annotation is the one channel that survives both limits.
      - name: Report failure
        if: failure()
        run: |
          strip() { sed 's/\x1b\[[0-9;]*m//g' ; }
          # Compiler errors are the interesting lines; a bare tail is mostly progress
          # noise ("compiling.release ..."). Grep for error context, keep the tail as
          # a fallback when nothing matches.
          {
            echo "=== ERRORS ==="
            grep -nE "error:|fatal error|undefined reference|No such file|^-I|-isystem|clang\+\+ .*-c " build.log 2>/dev/null | head -20
            echo "=== BUILD TAIL ==="
            tail -12 build.log 2>/dev/null
          } | strip > diag.txt || true
          echo "=== end ===" >> diag.txt
          while IFS= read -r line; do
            printf '::warning title=ci::%s\n' "${line//\%/%25}"
          done < diag.txt
          echo "### Android build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Verifies the package is real, and publishes the facts as an annotation:
      # the artifact itself lives in blob storage that is not reachable from every
      # environment, so the manifest has to be readable without downloading it.
      - name: Verify artifact
        run: |
          set -e
          pack=$(find build/android -name '*.levipack' | head -1)
          so=$(find build/android -name 'libCameraFacing.so' | head -1)
          echo "pack: $pack"
          echo "so:   $so"
          ls -la "$pack" "$so"
          python3 - "$pack" "$so" <<'PYEOF'
          import json, sys, zipfile, hashlib
          pack, so = sys.argv[1], sys.argv[2]
          z = zipfile.ZipFile(pack)
          names = z.namelist()
          manifest = json.loads(z.read("manifest.json"))
          lib = z.read(manifest["entry"])
          print("entries:", names)
          print("manifest:", json.dumps(manifest, indent=2))
          print("so bytes:", len(lib), "sha256:", hashlib.sha256(lib).hexdigest()[:16])
          # ELF header check: a real arm64 shared object, not an empty file.
          assert lib[:4] == b"\x7fELF", "entry is not an ELF file"
          assert lib[18:20] == b"\xb7\x00", f"not aarch64 (e_machine={lib[18:20].hex()})"
          machine = {0x03: "x86", 0x28: "arm", 0xb7: "aarch64"}.get(lib[18], hex(lib[18]))
          print("ELF machine:", machine, "type:", {2:"EXEC",3:"DYN"}.get(lib[16], lib[16]))
          # The .so inside the pack must be byte-identical to the built one.
          with open(so, "rb") as f:
              assert f.read() == lib, "packaged library differs from the built library"
          print("packaged library matches the build output")
          print(f"::notice title=levipack::{manifest['name']} v{manifest['version']} | entry={manifest['entry']} | {len(lib)} bytes | {machine}")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: CameraFacing-levipack
          path: build/android/arm64-v8a/release/*.levipack
          if-no-files-found: error
