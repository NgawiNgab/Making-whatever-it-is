name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on a normal runner with no Android toolchain: it proves the parts that can
  # be proven without a device (parser, resolver rules, report, data hygiene).
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests (plain g++)
        run: ./scripts/run_host_tests.sh

      - name: Build-data hygiene
        run: ./scripts/check_no_build_literals.sh

      - name: SDK API type-check
        run: ./scripts/check_sdk_api.sh

  # Same tests through the real build system, proving xmake.lua is valid and that
  # the host targets build under it. Without this, a broken build file is only
  # discovered on the Android runner.
  xmake-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.1.2

      - name: Configure for host
        run: xmake f -p linux -a x86_64 -m release -y

      - name: Build and run host tests
        run: xmake build -y camface_tests && xmake run -y camface_tests

  # The real artifact. Recipe copied from the reference (BedrockTools
  # .github/workflows/build.yml): xmake + nttld/setup-ndk@v1 for NDK r28c.
  #
  # This is the only place an Android build can happen: the NDK is installed by the
  # action on the runner, so nothing needs to be fetched from a local environment.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.1.2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          set -o pipefail
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }} 2>&1 | tee configure.log
          xmake -y 2>&1 | tee build.log

      # The job log lives in blob storage and the step summary is not exposed by the
      # API, but check-run *annotations* are. Emitting the failure as a warning
      # annotation is the one channel that survives both limits.
      - name: Report failure
        if: failure()
        run: |
          strip() { sed 's/\x1b\[[0-9;]*m//g' ; }
          # Compiler errors are the interesting lines; a bare tail is mostly progress
          # noise ("compiling.release ..."). Grep for error context, keep the tail as
          # a fallback when nothing matches.
          {
            echo "=== ERRORS ==="
            grep -nE "error:|Error|error|fatal|undefined reference|cannot|No such file" build.log 2>/dev/null | head -25
            echo "=== BUILD TAIL ==="
            tail -12 build.log 2>/dev/null
          } | strip > diag.txt || true
          echo "=== end ===" >> diag.txt
          while IFS= read -r line; do
            printf '::warning title=ci::%s\n' "${line//\%/%25}"
          done < diag.txt
          echo "### Android build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat diag.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show artifact
        run: find build/android -name '*.levipack' -o -name '*.so' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: CameraFacing-levipack
          path: build/android/arm64-v8a/release/*.levipack
          if-no-files-found: error
